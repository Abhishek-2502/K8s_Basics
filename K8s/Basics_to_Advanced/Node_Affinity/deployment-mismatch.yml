apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-mismatch-affinity
  namespace: node-affinity-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-mismatch-affinity
  template:
    metadata:
      labels:
        app: nginx-mismatch-affinity
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: disktype
                operator: In
                values:
                - hdd
