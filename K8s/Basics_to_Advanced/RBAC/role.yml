kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: apache-manager
  namespace: apache
rules:
  - apiGroups: ["", "apps","rbac.authorization.k8s.io","batch"] # "*" means the all core API group
    resources: ["pods", "deployments", "services"] # "replicasets", "configmaps", "secrets", "roles", "rolebindings", "cronjobs"
    verbs: ["get", "apply", "delete", "list", "watch", "create", "update", "patch"]