apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: training-dev
namePrefix: dev-

resources:
  - ../../base

images:
  - name: nginx
    newName: nginx
    newTag: 1.27-alpine

replicas:
  - name: web
    count: 1

configMapGenerator:
  - name: web-config
    behavior: merge
    literals:
      - APP_ENV=development

patches:
  - path: resource-patch.yaml
