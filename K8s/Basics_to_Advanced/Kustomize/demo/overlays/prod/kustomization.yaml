apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: training-prod
namePrefix: prod-

resources:
  - ../../base

images:
  - name: nginx
    newName: nginx
    newTag: "1.27"

replicas:
  - name: web
    count: 3

configMapGenerator:
  - name: web-config
    behavior: merge
    literals:
      - APP_ENV=production

patches:
  - path: resource-patch.yaml
